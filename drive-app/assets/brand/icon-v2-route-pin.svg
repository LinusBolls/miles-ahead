<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <!-- dashed treasure route, lower-left sweeping up toward the pin base -->
  <path d="M 196 902 C 360 902, 372 742, 470 712 C 588 676, 612 596, 712 576"
        fill="none" stroke="#0A0A0A" stroke-width="34"
        stroke-linecap="round" stroke-dasharray="6 70"/>
  <!-- map marker (pin) with the euro inside -->
  <g fill="#0A0A0A">
    <!-- teardrop: circular head + pointed base -->
    <path d="M 732 232
             a 158 158 0 1 0 0.01 0
             M 592 452
             L 732 724
             L 872 452 Z"/>
    <circle cx="732" cy="390" r="158"/>
  </g>
  <!-- euro knocked out white in the head -->
  <text x="732" y="408" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="bold"
        font-size="200" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">&#8364;</text>
</svg>
