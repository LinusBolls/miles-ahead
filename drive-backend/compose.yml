name: miles-drive
services:
  api:
    build: ./src
    image: miles-drive:latest
    network_mode: host          # reaches the scraper's Postgres on 127.0.0.1:55432; binds 127.0.0.1:8792 only
    env_file: /opt/miles-ops/.env   # OPS_DB_DSN of the read-only role ops_ro (shared with miles-ops, not copied)
    environment:
      REFRESH_S: "10"
    volumes:
      - ./data:/data            # SQLite: "I did it" taps
    mem_limit: 200m
    memswap_limit: 200m
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8792/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
